# Shared application environment for the web app and the background worker.
# Both run the same image and talk to the same database.
x-app-env: &app-env
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: careernexus_db
  DB_USER: career_app_user
  DB_PASSWORD: dbSecur3d
  # Job scraper (JobSpy) settings. These three boards need no proxies and
  # cover Canada/US well. LinkedIn needs rotating proxies; Google Jobs needs
  # a separate query format — neither is enabled here.
  JOB_SITES: indeed,zip_recruiter,glassdoor
  # Which country's Indeed site to search. JobSpy defaults to the US site,
  # so Canadian locations need this set or they return nothing.
  JOB_COUNTRY: Canada
  JOB_RESULTS_DIR: /app/job_results
  # Searches run in the background worker by default (the request returns a
  # progress page instantly). Set to "0" to scrape inline in the web request.
  SCRAPE_ASYNC: "1"
  # Absolute base URL used in emails (password resets, job alerts).
  APP_BASE_URL: http://localhost:8000
  # Email: with SMTP_HOST unset, messages are printed to the container log
  # (reset links / alerts are visible via `docker compose logs`). Set these to
  # send for real. See webapp/email_utils.py.
  # SMTP_HOST: smtp.example.com
  # SMTP_PORT: "587"
  # SMTP_USERNAME: you@example.com
  # SMTP_PASSWORD: app-password
  # SMTP_FROM: no-reply@example.com
  # Optional AI server (Ollama / any OpenAI-compatible endpoint). These are
  # only the boot-time defaults — the /settings page in the UI can set and
  # test the connection, and its saved values take precedence. See
  # docs/OLLAMA_SETUP.md for the full Windows + Ollama walkthrough.
  AI_ENABLED: "0"
  AI_BASE_URL: ""     # e.g. http://192.168.1.50:11434 (the GPU PC)
  AI_MODEL: ""        # e.g. qwen3:32b

services:
  db:
    image: mariadb:10.6
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: CareerNexPass32
      MARIADB_DATABASE: careernexus_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
    extra_hosts:
      # Lets the container reach an Ollama instance running on THIS host (not
      # needed when the model lives on another machine, e.g. the Windows PC).
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # Persist the generated job-search JSON files outside the container so
      # they're easy to inspect / hand to the AI matcher later.
      - ./job_results:/app/job_results
    healthcheck:
      # /health returns 200 when the app and its DB connection are good, 503
      # when degraded — so `docker compose ps` shows the real state.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Background worker: drains the scrape queue (so searches don't block the web
  # request) and runs scheduled saved-search alerts. Same image, no ports.
  worker:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./job_results:/app/job_results
    command: ["python", "-m", "webapp.worker"]

volumes:
  db_data:
