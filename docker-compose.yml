# Shared application environment for the web app and the background worker.
# Both run the same image and talk to the same database.
x-app-env: &app-env
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: careernexus_db
  DB_USER: career_app_user
  DB_PASSWORD: dbSecur3d
  # Job scraper (JobSpy) settings. These three boards need no proxies and
  # cover Canada/US well. LinkedIn needs rotating proxies; Google Jobs needs
  # a separate query format — neither is enabled here.
  JOB_SITES: indeed,zip_recruiter,glassdoor
  # Which country's Indeed site to search. JobSpy defaults to the US site,
  # so Canadian locations need this set or they return nothing.
  JOB_COUNTRY: Canada
  JOB_RESULTS_DIR: /app/job_results
  # Searches run in the background worker by default (the request returns a
  # progress page instantly). Set to "0" to scrape inline in the web request.
  SCRAPE_ASYNC: "1"
  # Absolute base URL used in emails (password resets, job alerts).
  APP_BASE_URL: http://localhost:8000
  # Email: with SMTP_HOST unset, messages are printed to the container log
  # (reset links / alerts are visible via `docker compose logs`). Set these to
  # send for real. See webapp/email_utils.py.
  # SMTP_HOST: smtp.example.com
  # SMTP_PORT: "587"
  # SMTP_USERNAME: you@example.com
  # SMTP_PASSWORD: app-password
  # SMTP_FROM: no-reply@example.com
  # Optional AI server (Ollama / any OpenAI-compatible endpoint). These are
  # only the boot-time defaults — the admin portal (port 8001) sets and tests
  # the connection, and its saved values take precedence. See
  # docs/OLLAMA_SETUP.md for the full Windows + Ollama walkthrough.
  AI_ENABLED: "0"
  AI_BASE_URL: ""     # e.g. http://192.168.1.50:11434 (a networked Ollama box)
  AI_MODEL: ""        # e.g. qwen2.5:3b
  # Bundled local Ollama engine (the `ollama` service below). A model slot with
  # "Use bundled local model" ticked in the admin portal talks to this.
  OLLAMA_LOCAL_URL: http://ollama:11434
  # Bootstrap admin for the admin portal (created on first start only). Change
  # these before exposing the portal anywhere untrusted.
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: admin
  ADMIN_EMAIL: admin@careernexus.local

services:
  db:
    image: mariadb:10.6
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: CareerNexPass32
      MARIADB_DATABASE: careernexus_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
    extra_hosts:
      # Lets the container reach an Ollama instance running on THIS host (not
      # needed when the model lives on another machine, e.g. the Windows PC).
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # Persist the generated job-search JSON files outside the container so
      # they're easy to inspect / hand to the AI matcher later.
      - ./job_results:/app/job_results
    healthcheck:
      # /health returns 200 when the app and its DB connection are good, 503
      # when degraded — so `docker compose ps` shows the real state.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Admin portal — separate Flask app on its own port (8001). Default login is
  # admin / admin (bootstrapped on first start; change ADMIN_* above).
  admin:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    command: ["gunicorn", "--bind", "0.0.0.0:8001", "--workers", "2",
              "--threads", "4", "--timeout", "120", "webapp.admin_app:admin_app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Background worker: drains the scrape queue (so searches don't block the web
  # request) and runs scheduled saved-search alerts. Same image, no ports.
  worker:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./job_results:/app/job_results
    command: ["python", "-m", "webapp.worker"]

  # Bundled local Ollama engine for running models on this server's own
  # hardware. Models the admin downloads persist in the ollama_models volume.
  # CPU-only by default; the admin catalog warns about models too big for RAM.
  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ollama_models:/root/.ollama
    # Not published to the host by default — reached in-network at
    # http://ollama:11434. Uncomment to expose it (LAN-only; Ollama has no auth):
    # ports:
    #   - "11434:11434"

volumes:
  db_data:
  ollama_models:
