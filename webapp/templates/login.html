{% extends "base.html" %}
{% block title %}Log in — Career Nexus{% endblock %}

{% block content %}
  <div class="authwrap">
    <div class="card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to upload resumes and search for jobs.</p>

      <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
        <div class="formgrid">
          <div>
            <label class="field-label" for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}"
                   autocomplete="email" required autofocus />
          </div>
          <div>
            <label class="field-label" for="password">Password</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" required />
          </div>
        </div>
        <div class="actions">
          <button class="btn big" type="submit">Log in →</button>
        </div>
      </form>

      <p class="authswap">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
  </div>
{% endblock %}
